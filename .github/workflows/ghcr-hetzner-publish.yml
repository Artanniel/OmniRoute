name: Build and publish to GHCR (Hetzner deploy)

# Workflow dedicado para o deploy no cluster K3s da Hetzner (Artanniel).
# Separado do "Publish to Docker Hub" (docker-publish.yml) do upstream, que
# aponta pro namespace diegosouzapw e precisa de secrets do Docker Hub que
# não configuramos neste fork. Este builda só o alvo runner-base (~500MB,
# porta 20128, sem Playwright/Chromium) e publica em ghcr.io/artanniel/omniroute.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # package-lock.json fica fora de sincronia com package.json quando
      # npm resolve contra o workspace completo (root + open-sse/) em vez do
      # contexto parcial que o Dockerfile copia antes do `npm ci` — reproduzido
      # de forma determinística tanto no servidor Hetzner quanto num runner
      # limpo do GitHub. Regenerar aqui, contra o checkout completo, corrige
      # antes do Docker COPY pegar o lockfile.
      - name: Sync package-lock.json
        run: |
          docker run --rm -v "$(pwd)":/app -w /app node:26-trixie-slim \
            npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund --ignore-scripts

      - name: Build and push (runner-base target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          tags: ghcr.io/artanniel/omniroute:latest
          cache-from: type=gha,scope=hetzner-runner-base
          cache-to: type=gha,scope=hetzner-runner-base,mode=max
